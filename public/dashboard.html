<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home — GiveFuel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#08090a; --panel:#0f1011; --surface:#191a1b; --surface2:#28282c;
    --text:#f7f8f8; --text2:#d0d6e0; --text3:#8a8f98; --text4:#62666d;
    --accent:#5e6ad2; --accent2:#7170ff; --accent3:#828fff;
    --green:#27a644; --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.05);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; font-feature-settings:'cv01','ss03'; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
  .nav { position:sticky; top:0; z-index:50; background:rgba(8,9,10,0.8); backdrop-filter:blur(12px); border-bottom:1px solid var(--border2); }
  .nav-in { max-width:1200px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:600; font-size:17px; letter-spacing:-0.3px; color:var(--text); text-decoration:none; }
  .brand svg { width:22px; height:22px; }
  .nav-links { display:flex; gap:8px; align-items:center; }
  .nav-links a { color:var(--text2); text-decoration:none; font-size:13.5px; font-weight:500; padding:7px 12px; border-radius:6px; }
  .nav-links a.active, .nav-links a:hover { color:var(--text); background:rgba(255,255,255,0.05); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; border:none; border-radius:6px; cursor:pointer; font-family:inherit; font-weight:500; text-decoration:none; transition:all .15s; }
  .btn-primary { background:var(--accent); color:#fff; padding:10px 20px; font-size:14px; }
  .btn-primary:hover { background:var(--accent3); }
  .btn-ghost { background:rgba(255,255,255,0.02); color:var(--text2); padding:9px 18px; font-size:14px; border:1px solid var(--border); }
  .btn-ghost:hover { background:rgba(255,255,255,0.05); color:var(--text); }
  .btn-ghost.btn-sm { padding:7px 12px; font-size:13px; }
  .wrap { max-width:1200px; margin:0 auto; padding:32px 24px 60px; }
  .cols { display:grid; grid-template-columns:1fr 340px; gap:20px; align-items:start; }
  .col { display:flex; flex-direction:column; gap:18px; }
  .head h1 { font-size:26px; font-weight:600; letter-spacing:-0.5px; }
  .head .sub { color:var(--text3); font-size:13.5px; margin-top:4px; }
  .sec-head { display:flex; align-items:center; justify-content:space-between; margin:8px 0 14px; }
  .sec-head h2 { font-size:17px; font-weight:600; }
  .sec-head a { color:var(--accent3); font-size:13px; text-decoration:none; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  .card { background:rgba(255,255,255,0.02); border:1px solid var(--border); border-radius:12px; padding:18px; display:flex; flex-direction:column; gap:9px; transition:border-color .15s; }
  .card:hover { border-color:rgba(255,255,255,0.16); }
  .card-top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .card h3 { font-size:15px; font-weight:600; line-height:1.35; }
  .card .meta { color:var(--text3); font-size:12.5px; }
  .card .prize { color:var(--accent3); font-weight:600; font-size:14px; }
  .proj-tag { background:rgba(255,255,255,0.05); color:var(--text2); padding:3px 10px; border-radius:999px; font-size:12px; font-weight:500; }
  .chain-tag { display:inline-flex; align-items:center; gap:5px; font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; text-transform:uppercase; padding:3px 9px; border-radius:5px; background:rgba(245,245,245,0.06); color:var(--text3); border:1px solid var(--border2); }
  .status { display:inline-flex; align-items:center; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px; }
  .status.open { background:rgba(39,166,68,0.12); color:var(--green); }
  .status.drawn { background:rgba(94,106,210,0.15); color:var(--accent3); }
  .status.closed { background:rgba(255,255,255,0.06); color:var(--text3); }
  .panel { background:rgba(255,255,255,0.02); border:1px solid var(--border); border-radius:12px; padding:18px; }
  .panel .h2 { font-size:14px; font-weight:600; margin-bottom:12px; }
  .list { display:flex; flex-direction:column; gap:10px; }
  .item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--border2); }
  .item:last-child { border-bottom:none; }
  .item h4 { font-size:13.5px; font-weight:600; }
  .item .m { color:var(--text3); font-size:12px; margin-top:2px; }
  .item .t { color:var(--text3); font-size:12px; margin-top:2px; }
  .stat-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .stat-card { background:rgba(255,255,255,0.02); border:1px solid var(--border); border-radius:10px; padding:14px; text-align:center; }
  .stat-card .n { font-size:22px; font-weight:600; color:var(--accent3); }
  .stat-card .l { color:var(--text3); font-size:11.5px; margin-top:2px; }
  .footer { border-top:1px solid var(--border2); padding:32px 0; color:var(--text4); font-size:13px; text-align:center; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--surface); border:1px solid var(--border); color:var(--text); padding:12px 20px; border-radius:8px; font-size:14px; opacity:0; transition:all .3s; z-index:100; box-shadow:0 8px 24px rgba(0,0,0,0.5); }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  @media (max-width:900px){ .cols{grid-template-columns:1fr} .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<nav class="nav"><div class="nav-in">
  <a class="brand" href="/"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="4" fill="#5e6ad2"/><path d="M8 10h8M8 14h5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>GiveFuel</a>
  <div class="nav-links">
    <a href="/explore.html">Explore</a>
    <a href="/dashboard.html" class="active">Dashboard</a>
    <a href="/profile.html">Profile</a>
    <span id="userlabel" style="color:var(--text3);font-size:13px"></span>
    <button id="btn-logout" class="btn btn-ghost btn-sm">Sign out</button>
  </div>
</div></nav>

<div class="wrap">
  <div class="head">
    <h1>Dashboard</h1>
    <div class="sub">Live giveaways, your projects, and your activity.</div>
  </div>

  <div class="cols">
    <div class="col">
      <div>
        <div class="sec-head"><h2>🔥 Live giveaways</h2><a href="/explore.html">Explore all →</a></div>
        <div class="grid" id="live"></div>
      </div>
      <div>
        <div class="sec-head"><h2>🛠️ Your projects</h2><a href="#" id="lnk-newproject">+ New</a></div>
        <div class="panel" id="project-form" style="display:none;margin-bottom:12px">
          <div class="lbl" style="font-size:12px;font-weight:600;color:var(--text3);margin-bottom:6px">Project name</div><input class="inp" id="p-name" placeholder="Bantol DAO" style="width:100%;background:#0d0e10;border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:6px;font-size:13px;outline:none;font-family:inherit;margin-bottom:8px">
          <select class="inp" id="p-type" style="width:100%;background:#0d0e10;border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:6px;font-size:13px;outline:none;font-family:inherit;margin-bottom:8px"><option value="dao">DAO</option><option value="nft">NFT</option><option value="community">Community</option></select>
          <input class="inp" id="p-desc" placeholder="Description" style="width:100%;background:#0d0e10;border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:6px;font-size:13px;outline:none;font-family:inherit;margin-bottom:8px">
          <input class="inp" id="p-x" placeholder="X handle" style="width:100%;background:#0d0e10;border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:6px;font-size:13px;outline:none;font-family:inherit;margin-bottom:8px">
          <input class="inp" id="p-dc" placeholder="Discord invite" style="width:100%;background:#0d0e10;border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:6px;font-size:13px;outline:none;font-family:inherit;margin-bottom:8px">
          <button class="btn btn-primary" id="btn-saveproject" style="width:100%">Create project</button>
        </div>
        <div id="projects-list" class="list" style="background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:12px;padding:14px 18px"></div>
      </div>
    </div>

    <div class="col">
      <div class="stat-row">
        <div class="stat-card"><div class="n" id="s-hosted">0</div><div class="l">Hosted</div></div>
        <div class="stat-card"><div class="n" id="s-entered">0</div><div class="l">Entered</div></div>
        <div class="stat-card"><div class="n" id="s-projects">0</div><div class="l">Projects</div></div>
      </div>
      <div class="panel"><div class="h2">Your giveaways</div><div id="mine" class="list"></div></div>
      <div class="panel"><div class="h2">Giveaways you entered</div><div id="entered" class="list"></div></div>
    </div>
  </div>
</div>
<div class="footer">GiveFuel — free Web3 giveaway &amp; quest platform. © 2026</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2600);}
async function api(path,opts){const r=await fetch(path,opts);return r.json();}
function statusLabel(s){ return s==='open'?'Open':s==='drawn'?'Drawn':'Closed'; }
function taskLabel(t){
  const raw=String(t.target||'');
  switch(t.type){
    case 'follow_x': { const m=raw.match(/x\.com\/([A-Za-z0-9_]+)/i); const h=m?m[1]:raw.replace(/^@/,'').replace(/[^A-Za-z0-9_]/g,''); return 'Follow @'+h+' on X'; }
    case 'like_x': return 'Like the post on X';
    case 'repost_x': return 'Repost the post on X';
    case 'join_dc': return 'Join the Discord server';
    case 'connect_x': return 'Connect X to enter';
    case 'connect_dc': return 'Connect Discord to enter';
    default: return 'Complete a task';
  }
}
async function load(){
  const me = await api('/api/me');
  if(!me.id){ location.href='/auth/dc/login?redirect='+encodeURIComponent('/dashboard.html'); return; }
  $('#userlabel').textContent='👤 '+(me.dc_username||me.x_username);

  const d = await api('/api/dashboard');
  $('#s-hosted').textContent=(d.mine||[]).length;
  $('#s-entered').textContent=(d.entered||[]).length;
  $('#s-projects').textContent=(d.myProjects||[]).length;

  // live giveaways (open only)
  const all = await api('/api/giveaways');
  const live=$('#live'); live.innerHTML='';
  const open=(all||[]).filter(g=>g.status==='open');
  if(!open.length) live.innerHTML='<div style="grid-column:1/-1;color:var(--text4);font-size:13px;padding:20px 0">No live giveaways right now — be the first to launch one.</div>';
  for(const g of open){
    let tasks=[]; try{tasks=JSON.parse(g.tasks||'[]');}catch(e){}
    if(!tasks.length){ if(g.require_x_follow)tasks.push({type:'follow_x',target:g.require_x_follow}); if(g.require_dc_guild)tasks.push({type:'join_dc'}); }
    const labels=tasks.map(taskLabel).slice(0,2);
    const card=document.createElement('div'); card.className='card';
    card.innerHTML=`
      <div class="card-top"><h3>${esc(g.title)}</h3><span class="chain-tag">${esc(g.chain||'evm')}</span></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${g.project_name?`<span class="proj-tag">${esc(g.project_name)}</span>`:''}<span class="status open">Open</span></div>
      <div class="meta">${g.entry_count} entries · by ${esc(g.host||'?')}</div>
      ${g.prize?`<div class="prize">${esc(g.prize)}</div>`:''}
      <ul style="list-style:none;display:flex;flex-direction:column;gap:4px;color:var(--text3);font-size:12.5px">${labels.map(l=>`<li>• ${esc(l)}</li>`).join('')}</ul>
      <a class="btn btn-ghost btn-sm" href="/giveaway.html?id=${g.id}" style="margin-top:2px">View giveaway</a>`;
    live.appendChild(card);
  }

  // mine
  const mine=$('#mine'); mine.innerHTML='';
  if(!(d.mine||[]).length) mine.innerHTML='<div style="color:var(--text4);font-size:12.5px">No giveaways yet.</div>';
  (d.mine||[]).forEach(g=>{
    const el=document.createElement('div'); el.className='item';
    el.innerHTML=`<div><h4>${esc(g.title)}</h4><div class="m">${g.entry_count} entries · ${esc(g.status)}</div></div><div style="display:flex;gap:6px"><a class="btn btn-ghost btn-sm" href="/giveaway.html?id=${g.id}">View</a><a class="btn btn-ghost btn-sm" href="/g/${g.id}" target="_blank">Share</a></div>`;
    mine.appendChild(el);
  });
  // entered
  const ent=$('#entered'); ent.innerHTML='';
  if(!(d.entered||[]).length) ent.innerHTML='<div style="color:var(--text4);font-size:12.5px">You haven\'t entered any giveaways yet.</div>';
  (d.entered||[]).forEach(g=>{
    const el=document.createElement('div'); el.className='item';
    el.innerHTML=`<div><h4>${esc(g.title)}</h4><div class="m">${g.entry_count} entries</div></div><a class="btn btn-ghost btn-sm" href="/giveaway.html?id=${g.id}">View</a>`;
    ent.appendChild(el);
  });
  // projects
  const pl=$('#projects-list'); pl.innerHTML='';
  if(!(d.myProjects||[]).length) pl.innerHTML='<div style="color:var(--text4);font-size:12.5px">No projects yet — create one to organize giveaways.</div>';
  (d.myProjects||[]).forEach(p=>{
    const el=document.createElement('div'); el.className='item';
    el.innerHTML=`<div><h4>${esc(p.name)}</h4><div class="t">${esc(p.type||'')} · ${p.giveaway_count} giveaways</div></div><a class="btn btn-ghost btn-sm" href="/project.html?id=${p.id}">Open</a>`;
    pl.appendChild(el);
  });
}
$('#btn-logout').onclick=async()=>{ await fetch('/api/logout',{method:'POST'}); location.href='/'; };
$('#lnk-newproject').onclick=e=>{ e.preventDefault(); $('#project-form').style.display=$('#project-form').style.display==='none'?'block':'none'; };
$('#btn-saveproject').onclick=async()=>{
  const name=$('#p-name').value.trim(); if(!name) return toast('Project name required');
  const r=await api('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,type:$('#p-type').value,description:$('#p-desc').value.trim(),twitter:$('#p-x').value.trim(),discord:$('#p-dc').value.trim()})});
  if(r.error) return toast(r.error);
  toast('✅ Project created'); $('#project-form').style.display='none'; $('#p-name').value='';$('#p-desc').value='';$('#p-x').value='';$('#p-dc').value=''; load();
};
load();
</script>
</body>
</html>
