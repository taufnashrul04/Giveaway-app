<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giveaway — GiveFuel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#08090a; --panel:#0f1011; --surface:#191a1b;
    --text:#f7f8f8; --text2:#d0d6e0; --text3:#8a8f98; --text4:#62666d;
    --accent:#5e6ad2; --accent2:#7170ff; --accent3:#828fff;
    --green:#27a644; --red:#e5484d; --amber:#f5a524;
    --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.05);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; font-feature-settings:'cv01','ss03'; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
  .nav { position:sticky; top:0; z-index:50; background:rgba(8,9,10,0.8); backdrop-filter:blur(12px); border-bottom:1px solid var(--border2); }
  .nav-in { max-width:760px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:600; font-size:17px; color:var(--text); text-decoration:none; }
  .brand svg { width:22px; height:22px; }
  .nav-right { display:flex; gap:8px; align-items:center; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; border:none; border-radius:6px; cursor:pointer; font-family:inherit; font-weight:500; text-decoration:none; transition:all .15s; }
  .btn-primary { background:var(--accent); color:#fff; padding:11px 20px; font-size:14.5px; width:100%; }
  .btn-primary:hover { background:var(--accent3); }
  .btn-primary:disabled { background:#2a2f45; color:var(--text4); cursor:not-allowed; }
  .btn-ghost { background:rgba(255,255,255,0.02); color:var(--text2); padding:8px 14px; font-size:13.5px; border:1px solid var(--border); }
  .btn-ghost:hover { background:rgba(255,255,255,0.05); color:var(--text); }
  .btn-sm { padding:6px 12px; font-size:13px; }
  .wrap { max-width:760px; margin:0 auto; padding:32px 24px 64px; }
  .card { background:rgba(255,255,255,0.02); border:1px solid var(--border); border-radius:14px; padding:28px; margin-bottom:16px; }
  .hdr { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:8px; }
  .h1 { font-size:28px; font-weight:600; letter-spacing:-0.6px; line-height:1.15; }
  .collab { display:inline-flex; align-items:center; gap:6px; background:rgba(94,106,210,0.12); color:var(--accent3); border:1px solid rgba(94,106,210,0.25); padding:4px 12px; border-radius:999px; font-size:13px; font-weight:500; margin-bottom:14px; }
  .host { color:var(--text3); font-size:14px; margin-bottom:16px; }
  .prize { font-size:26px; font-weight:600; color:var(--accent3); letter-spacing:-0.4px; margin:14px 0; }
  .stats { display:flex; gap:12px; margin:20px 0; }
  .stat { flex:1; text-align:center; background:#0d0e10; border:1px solid var(--border); border-radius:12px; padding:16px 10px; }
  .stat .n { font-size:26px; font-weight:600; }
  .stat .l { font-size:12px; color:var(--text3); margin-top:2px; }
  .open .n { color:var(--accent3); }
  .desc { color:var(--text2); line-height:1.6; white-space:pre-wrap; font-size:15px; }
  .status { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; padding:5px 12px; border-radius:999px; }
  .status.open { background:rgba(39,166,68,0.12); color:var(--green); }
  .status.drawn { background:rgba(94,106,210,0.15); color:var(--accent3); }
  .status.closed { background:rgba(255,255,255,0.06); color:var(--text3); }
  .h2 { font-size:17px; font-weight:600; letter-spacing:-0.2px; margin-bottom:14px; }
  .chk { color:var(--text3); font-size:13px; margin-bottom:12px; }
  .tasks { list-style:none; display:flex; flex-direction:column; gap:8px; }
  .tasks li { display:flex; align-items:center; gap:10px; padding:12px 14px; border:1px solid var(--border); border-radius:10px; background:#0d0e10; }
  .dot { width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; flex-shrink:0; }
  .dot.ok { background:rgba(39,166,68,0.15); color:var(--green); border:1px solid var(--green); }
  .dot.no { background:rgba(229,72,77,0.15); color:var(--red); border:1px solid var(--red); }
  .dot.wait { background:rgba(245,165,36,0.12); color:var(--amber); border:1px solid var(--amber); }
  .task-title { font-weight:500; font-size:14px; flex:1; }
  .share-row { display:flex; align-items:center; gap:8px; margin-top:16px; }
  .share-input { flex:1; background:#0d0e10; border:1px solid var(--border); color:var(--text2); font-family:'JetBrains Mono',monospace; font-size:12.5px; padding:10px 12px; border-radius:6px; outline:none; }
  .winner { background:rgba(39,166,68,0.08); border:1px solid rgba(39,166,68,0.25); border-radius:10px; padding:12px 14px; margin-bottom:8px; font-size:14px; }
  .connection { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border2); }
  .connection:last-child { border-bottom:none; }
  .connection .l { font-size:14px; font-weight:500; }
  .connection .s { font-size:13px; color:var(--text3); }
  .con-yes { color:var(--green); } .con-no { color:var(--text4); }
  .table { width:100%; border-collapse:collapse; font-size:13.5px; }
  .table th, .table td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--border2); }
  .table th { color:var(--text3); font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; font-weight:600; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--surface); border:1px solid var(--border); color:var(--text); padding:12px 20px; border-radius:8px; font-size:14px; opacity:0; transition:all .3s; z-index:100; box-shadow:0 8px 24px rgba(0,0,0,0.5); }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  @media (max-width:600px){ .h1{font-size:23px} .wrap{padding:20px 16px 48px} .stats{flex-direction:column} }
</style>
</head>
<body>
<nav class="nav"><div class="nav-in">
  <a class="brand" href="/"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="4" fill="#5e6ad2"/><path d="M8 10h8M8 14h5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>GiveFuel</a>
  <div class="nav-right">
    <span id="userlabel" style="color:var(--text3);font-size:13px;font-weight:500"></span>
    <a href="/auth/dc/login" id="btn-login-header" class="btn btn-ghost btn-sm">Sign in</a>
    <a href="/dashboard.html" id="nav-dash" class="btn btn-ghost btn-sm" style="display:none">Dashboard</a>
    <button id="btn-logout" class="btn btn-ghost btn-sm" style="display:none">Sign out</button>
  </div>
</div></nav>

<div class="wrap">
  <div id="load" style="color:var(--text3);text-align:center;padding:60px 0">Loading giveaway…</div>
  <div id="main" style="display:none">
    <div class="card">
      <div class="hdr">
        <div>
          <div id="collab" class="collab" style="display:none"></div>
          <h1 class="h1" id="g-title"></h1>
          <div class="host" id="g-host"></div>
        </div>
        <span id="g-badge" class="status"></span>
      </div>
      <div id="g-prize" class="prize"></div>
      <div class="stats">
        <div class="stat open"><div class="n" id="stat-entries">0</div><div class="l">Entries</div></div>
        <div class="stat"><div class="n" id="stat-winners">0</div><div class="l">Winners</div></div>
        <div class="stat"><div class="n" id="stat-end">–</div><div class="l">Ends</div></div>
      </div>
      <div id="g-desc" class="desc"></div>
      <div id="winner-box" style="margin-top:16px"></div>
    </div>

    <div class="card">
      <h2 class="h2">Requirements</h2>
      <div class="chk">Complete each task to enter. Tap a task to open X.</div>
      <ul class="tasks" id="task-list"></ul>
      <div class="share-row" id="share-row">
        <input class="share-input" id="share-link" readonly value="">
        <button class="btn btn-ghost btn-sm" id="btn-copy">Copy link</button>
      </div>
      <div id="action-area" style="margin-top:18px">
        <button class="btn btn-primary" id="btn-join">Join giveaway</button>
      </div>
      <div id="connected-note" style="color:var(--text3);font-size:13px;margin-top:12px;text-align:center"></div>
    </div>

    <div class="card" id="participants-card" style="display:none">
      <h2 class="h2">Participants (<span id="part-count">0</span>)</h2>
      <table class="table"><thead><tr><th>#</th><th>Discord</th><th>X</th><th>Wallet</th><th>Verify</th></tr></thead><tbody id="part-tbody"></tbody></table>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GWID = new URLSearchParams(location.search).get('id');
let ME = null;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
async function api(path, opts){ const r=await fetch(path, opts); return r.json(); }

function taskLabel(t){
  const raw=String(t.target||'');
  switch(t.type){
    case 'follow_x': { const m=raw.match(/x\.com\/([A-Za-z0-9_]+)/i); const h=m?m[1]:raw.replace(/^@/,'').replace(/[^A-Za-z0-9_]/g,''); return 'Follow @'+h+' on X'; }
    case 'like_x': return 'Like the post on X';
    case 'repost_x': return 'Repost the post on X';
    case 'join_dc': return 'Join the Discord server';
    case 'connect_x': return 'Connect your X account';
    case 'connect_dc': return 'Connect your Discord account';
    default: return t.label || 'Complete task';
  }
}
function xActionUrl(t){
  const raw=String(t.target||'');
  if(t.type==='follow_x'){ const m=raw.match(/x\.com\/([A-Za-z0-9_]+)/i); const h=m?m[1]:raw.replace(/^@/,'').replace(/[^A-Za-z0-9_]/g,''); return h?'https://x.com/'+h:'#'; }
  if(t.type==='like_x'||t.type==='repost_x'){ const m=raw.match(/status\/(\d+)/)||raw.match(/\/i\/status\/(\d+)/)||raw.match(/^(\d{10,25})$/); return m?'https://x.com/i/status/'+m[1]:'#'; }
  return '#';
}

async function loadMe(){
  const d = await api('/api/me'); ME=d;
  const loginBtn=$('#btn-login-header'), dashBtn=$('#nav-dash'), logoutBtn=$('#btn-logout');
  if(d.id){ loginBtn.style.display='none'; dashBtn.style.display='inline-flex'; logoutBtn.style.display='inline-flex'; $('#userlabel').textContent='👤 '+(d.dc_username||d.x_username||'user'); }
  else { loginBtn.style.display='inline-flex'; dashBtn.style.display='none'; logoutBtn.style.display='none'; }
}
$('#btn-logout').onclick=async()=>{ await fetch('/api/logout',{method:'POST'}); location.href='/'; };

// EVM / Sol address validation (client-side)
function validWallet(w, chain){ if(!w) return false; if(chain==='evm') return /^0x[0-9a-fA-F]{40}$/.test(w); if(chain==='sol') return /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(w); return false; }

// renderWalletGate — kalau belum set wallet + giveaway butuh chain → minta set dulu
async function renderWalletGate(g){
  const area=$('#action-area'); area.innerHTML='';
  if(!ME||!ME.id) return;
  // butuh wallet kalau giveaway minta chain EVM/Sol (anchor utk hadiah)
  if(!ME.wallet || !ME.wallet_chain){
    const chain = (g.chain||'evm').toLowerCase()==='sol'?'sol':'evm';
    area.innerHTML=`
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px">
        <div style="font-weight:600;font-size:14px;margin-bottom:4px">Add your wallet to enter</div>
        <div style="color:var(--text3);font-size:13px;margin-bottom:12px">This giveaway distributes prizes on <b style="color:var(--text2);text-transform:uppercase">${chain==='sol'?'Solana':'EVM'}</b>. Add your ${chain==='sol'?'Solana':'EVM'} address to participate.</div>
        <select id="gw-chain" style="background:#0d0e10;border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:6px;font-size:13px;margin-bottom:8px;width:100%;font-family:inherit">
          <option value="evm" ${chain!=='sol'?'selected':''}>EVM (0x…)</option>
          <option value="sol" ${chain==='sol'?'selected':''}>Solana</option>
        </select>
        <input id="gw-wallet" placeholder="${chain==='sol'?'Solana address (base58)':'EVM address (0x…)'}" style="width:100%;background:#0d0e10;border:1px solid var(--border);color:var(--text);padding:11px 13px;border-radius:6px;font-size:14px;margin-bottom:8px;outline:none;font-family:inherit">
        <button class="btn btn-primary" id="gw-save">Save wallet &amp; continue</button>
        <div id="gw-err" style="color:#e5484d;font-size:13px;margin-top:8px"></div>
      </div>
      <button class="btn btn-primary" id="btn-join">Join giveaway</button>`;
    const save=$('#gw-save'); const input=$('#gw-wallet'); const sel=$('#gw-chain');
    save.onclick=async()=>{
      const c=sel.value, w=input.value.trim();
      if(!validWallet(w,c)){ $('#gw-err').textContent = c==='evm'?'Invalid EVM address (0x + 40 hex)':'Invalid Solana address'; return; }
      const r=await api('/api/me/wallet',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({wallet:w,chain:c})});
      if(r.ok){ ME.wallet=w; ME.wallet_chain=c; toast('✅ Wallet saved'); renderWalletGate(g); }
      else $('#gw-err').textContent = r.error||'Failed to save';
    };
    return;
  }
  // sudah ada wallet — normal join button + catatan wallet
  const btn=$('#btn-join'); area.appendChild(btn);
  $('#connected-note').textContent='Wallet: '+ME.wallet.slice(0,8)+'… ('+ME.wallet_chain.toUpperCase()+')'+(ME.wallet_chain!==g.chain?' — note: giveaway is on '+g.chain.toUpperCase():'');
}

function renderAction(needX){
  const area=$('#action-area'), btn=$('#btn-join'); 
  if(!ME||!ME.id){ area.innerHTML=`<a class="btn btn-primary" href="/auth/dc/login?redirect=${encodeURIComponent('/giveaway.html?id='+GWID)}">Sign in with Discord</a>`; return; }
  if(needX && !ME.x_username){ area.innerHTML=`<a class="btn btn-primary" href="/auth/x/login?redirect=${encodeURIComponent('/giveaway.html?id='+GWID)}">Connect X to continue</a>`; return; }
  area.appendChild(btn);
  const note=$('#connected-note'); note.textContent='Click join — we auto-check your tasks. If all pass, you\'re in instantly.';
}
const collabNames = ['X','Vault','DAO','NFT','Protocol','Labs','Finance','Base','Ethereum'];

async function render(){
  const g = await api('/api/giveaways/'+GWID);
  if(g.error){ $('#load').innerHTML='<p style="text-align:center">'+esc(g.error)+'</p>'; return; }
  $('#main').style.display='block'; $('#load').style.display='none';
  $('#g-title').textContent = g.title;
  $('#g-host').textContent = 'Hosted by ' + (g.host.x_username||g.host.dc_username||'community');
  if(g.project){ $('#collab').style.display='inline-flex'; $('#collab').textContent='✦ '+g.project.name+' × GiveFuel'; }
  $('#g-prize').textContent = g.prize || '';
  $('#stat-entries').textContent = g.entry_count;
  $('#stat-winners').textContent = g.winners_count;
  $('#stat-end').textContent = g.ends_at ? new Date(g.ends_at).toLocaleDateString() : 'Open';
  $('#g-desc').textContent = g.description || '';
  const badge=$('#g-badge'); badge.className='status '+g.status; badge.textContent = g.status==='open'?'Open':g.status==='drawn'?'Drawn':'Closed';

  // winners
  const wb=$('#winner-box'); wb.innerHTML='';
  if(g.winners&&g.winners.length){
    wb.innerHTML='<div class="h2" style="margin-bottom:10px">🏆 Winners</div>';
    for(const w of g.winners){ const el=document.createElement('div'); el.className='winner'; el.textContent='🎉 '+(w.dc_username||w.x_username||'#'+w.user_id); wb.appendChild(el); }
  }

  // tasks (static)
  const tl=$('#task-list'); tl.innerHTML='';
  for(const t of (g.tasks||[])){
    const li=document.createElement('li');
    const dot=document.createElement('div'); dot.className='dot wait'; dot.textContent='•';
    const tb=document.createElement('span'); tb.className='task-title'; tb.textContent=taskLabel(t);
    li.appendChild(dot); li.appendChild(tb);
    if(['follow_x','like_x','repost_x'].includes(t.type)){
      const a=document.createElement('a'); a.className='btn btn-ghost btn-sm'; a.href=xActionUrl(t); a.target='_blank'; a.rel='noopener'; a.textContent='Open X ↗'; a.style.cssText='margin-left:auto;white-space:nowrap';
      li.appendChild(a);
    }
    tl.appendChild(li);
  }

  // share link
  const shareUrl = location.origin + '/g/' + GWID;
  $('#share-link').value = shareUrl;
  $('#btn-copy').onclick=()=>{ navigator.clipboard.writeText(shareUrl).then(()=>toast('✅ Link copied — share it anywhere')).catch(()=>{ $('#share-link').select(); document.execCommand('copy'); toast('✅ Link copied'); }); };

  // action
  const needX=(g.tasks||[]).some(t=>['follow_x','like_x','repost_x','connect_x'].includes(t.type));
  const btn=$('#btn-join');
  btn.disabled = !(ME&&ME.id) || g.status!=='open';
  btn.textContent = g.status!=='open' ? 'Giveaway closed' : 'Join giveaway';
  btn.onclick = async ()=>{
    btn.disabled=true; btn.textContent='Checking…';
    const r = await api('/api/giveaways/'+GWID+'/enter',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    btn.disabled=false; btn.textContent='Join giveaway';
    if(r.entered){
      if(r.verified) toast('✅ You\'re in! Good luck 🍀');
      else {
        const belum=(r.tasks||[]).filter(t=>!t.ok).map(t=>'• '+taskLabel(t)).join('\n');
        const pending=(r.tasks||[]).filter(t=>!t.ok).length;
        toast('⚠️ '+pending+' task(s) not complete yet');
        // highlight merah
        tl.querySelectorAll('li').forEach((li,i)=>{ const dot=li.querySelector('.dot'); dot.className='dot no'; dot.textContent='✕'; });
        setTimeout(()=>render(),3000);
      }
    } else toast(r.error||'Failed to join');
  };
  // wallet gate dulu kalau perlu, else action login/join
  if(ME && ME.id){ await renderWalletGate(g); }
  else renderAction(needX);

  // participants (host)
  if(g.isHost){
    $('#participants-card').style.display='block';
    const parts=await api('/api/giveaways/'+GWID+'/participants');
    $('#part-count').textContent=parts.length;
    const tb=$('#part-tbody'); tb.innerHTML='';
    parts.forEach((p,i)=>{ const tr=document.createElement('tr'); tr.innerHTML=`<td>${i+1}</td><td>${esc(p.dc_username||'–')}</td><td>${esc(p.x_username||'–')}</td><td style="font-family:monospace;font-size:12px">${esc(p.wallet?p.wallet.slice(0,8)+'…':'–')}</td><td>${p.verified?'✅':'⛔'}</td>`; tb.appendChild(tr); });

    // Host action: End giveaway (closes + auto-draws winners)
    const actArea=$('#action-area');
    if(g.status==='open'){
      const row=document.createElement('div');
      row.style.cssText='display:flex;gap:8px;margin-top:10px;flex-wrap:wrap';
      row.innerHTML=`<button class="btn btn-ghost" id="btn-end" style="border-color:rgba(255,80,80,.35);color:#ff6b6b">⏹ End giveaway</button>`;
      actArea.appendChild(row);
      $('#btn-end').onclick=async()=>{
        if(!confirm('End this giveaway now? It closes to new entries and auto-draws winners from verified entries immediately.')) return;
        try{
          const r=await api('/api/giveaways/'+GWID+'/end',{method:'POST'});
          toast(r.autoDrawn ? ('🎉 Ended — '+ (r.winners||[]).length +' winner(s) drawn') : '⏹ Giveaway ended (no verified entries)');
          setTimeout(()=>render(),1200);
        }catch(e){ toast('⚠️ '+e.message); }
      };
    }
  }
}

loadMe().then(render);
</script>
</body>
</html>
